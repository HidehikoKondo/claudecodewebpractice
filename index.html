<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITパスポートクイズ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      padding: 36px;
      max-width: 720px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      color: #0f3460;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    /* ===== TOP PAGE ===== */
    .top-page { display: block; }
    .top-page.hide { display: none; }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 8px;
    }

    .category-card {
      border: none;
      border-radius: 14px;
      padding: 24px 28px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      gap: 20px;
      color: #fff;
      font-family: inherit;
    }

    .category-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.25);
    }

    .category-card.strategy  { background: linear-gradient(135deg, #667eea, #764ba2); }
    .category-card.management { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .category-card.technology { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #003d5b; }

    .card-icon { font-size: 2.4rem; flex-shrink: 0; }

    .card-body .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .card-body .card-desc {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .card-arrow {
      margin-left: auto;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    /* ===== QUIZ PAGE ===== */
    .quiz-page { display: none; }
    .quiz-page.show { display: block; }

    .progress-bar {
      background: #e0e0e0;
      border-radius: 8px;
      height: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, #0f3460, #e94560);
      height: 100%;
      border-radius: 8px;
      transition: width 0.4s ease;
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #888;
    }

    .category-badge {
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
    }

    .badge-strategy   { background: #764ba2; }
    .badge-management { background: #f5576c; }
    .badge-technology { background: #0088cc; }

    .question-text {
      font-size: 1.1rem;
      color: #222;
      line-height: 1.7;
      margin-bottom: 24px;
      font-weight: 500;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #f8f9fa;
      border: 2px solid #dee2e6;
      border-radius: 10px;
      padding: 14px 18px;
      text-align: left;
      cursor: pointer;
      font-size: 0.95rem;
      color: #333;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: inherit;
    }

    .option-btn:hover:not(:disabled) {
      background: #e8f0fe;
      border-color: #0f3460;
      color: #0f3460;
    }

    .option-btn.correct {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }

    .option-btn.incorrect {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }

    .option-btn:disabled { cursor: default; }

    .option-label {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #dee2e6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .option-btn.correct  .option-label { background: #28a745; color: #fff; }
    .option-btn.incorrect .option-label { background: #dc3545; color: #fff; }

    .explanation {
      margin-top: 20px;
      padding: 16px;
      background: #f0f4ff;
      border-left: 4px solid #0f3460;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #333;
      line-height: 1.6;
      display: none;
    }

    .explanation.show { display: block; }
    .explanation strong { color: #0f3460; }

    .btn-next {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #0f3460, #e94560);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      display: none;
      transition: opacity 0.2s;
      font-family: inherit;
    }

    .btn-next:hover { opacity: 0.9; }
    .btn-next.show { display: block; }

    /* ===== RESULT PAGE ===== */
    .result-page { display: none; }
    .result-page.show { display: block; text-align: center; }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0f3460, #e94560);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #fff;
      box-shadow: 0 8px 24px rgba(15,52,96,0.4);
    }

    .score-number { font-size: 2.4rem; font-weight: bold; line-height: 1; }
    .score-label  { font-size: 0.85rem; margin-top: 4px; }

    .result-page h2 {
      font-size: 1.4rem;
      color: #0f3460;
      margin-bottom: 12px;
    }

    .result-message {
      color: #555;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .result-breakdown {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .breakdown-item {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 14px 8px;
      font-size: 0.85rem;
    }

    .breakdown-item .val {
      font-size: 1.5rem;
      font-weight: bold;
      color: #0f3460;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-restart, .btn-top {
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
      font-family: inherit;
    }

    .btn-restart {
      background: linear-gradient(90deg, #0f3460, #e94560);
      color: #fff;
    }

    .btn-top {
      background: #f0f0f0;
      color: #333;
    }

    .btn-restart:hover, .btn-top:hover { opacity: 0.85; }
  </style>
</head>
<body>
<div class="container">
  <h1>🖥️ ITパスポートクイズ</h1>
  <p class="subtitle">ITパスポート試験の頻出問題にチャレンジしよう！</p>

  <!-- TOP PAGE -->
  <div class="top-page" id="topPage">
    <div class="category-grid">
      <button class="category-card strategy" onclick="startQuiz('strategy')">
        <span class="card-icon">📊</span>
        <div class="card-body">
          <div class="card-title">ストラテジ系</div>
          <div class="card-desc">経営戦略・情報戦略・業務分析など</div>
        </div>
        <span class="card-arrow">›</span>
      </button>
      <button class="category-card management" onclick="startQuiz('management')">
        <span class="card-icon">📋</span>
        <div class="card-body">
          <div class="card-title">マネジメント系</div>
          <div class="card-desc">プロジェクト管理・サービス管理・開発手法など</div>
        </div>
        <span class="card-arrow">›</span>
      </button>
      <button class="category-card technology" onclick="startQuiz('technology')">
        <span class="card-icon">💻</span>
        <div class="card-body">
          <div class="card-title">テクノロジ系</div>
          <div class="card-desc">ハードウェア・ソフトウェア・ネットワーク・セキュリティなど</div>
        </div>
        <span class="card-arrow">›</span>
      </button>
    </div>
  </div>

  <!-- QUIZ PAGE -->
  <div class="quiz-page" id="quizPage">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="question-meta">
      <span id="questionCounter">問題 1 / 10</span>
      <span class="category-badge" id="categoryBadge"></span>
    </div>
    <p class="question-text" id="questionText"></p>
    <div class="options" id="optionsContainer"></div>
    <div class="explanation" id="explanation"></div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">次の問題へ →</button>
  </div>

  <!-- RESULT PAGE -->
  <div class="result-page" id="resultPage">
    <div class="score-circle">
      <span class="score-number" id="scoreNumber">0</span>
      <span class="score-label">/ 10 問</span>
    </div>
    <h2 id="resultTitle"></h2>
    <p class="result-message" id="resultMessage"></p>
    <div class="result-breakdown">
      <div class="breakdown-item">
        <div class="val" id="correctCount">0</div>
        <div>正解</div>
      </div>
      <div class="breakdown-item">
        <div class="val" id="incorrectCount">0</div>
        <div>不正解</div>
      </div>
      <div class="breakdown-item">
        <div class="val" id="accuracyRate">0%</div>
        <div>正答率</div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn-top" onclick="goTop()">カテゴリ選択に戻る</button>
      <button class="btn-restart" onclick="restartQuiz()">もう一度挑戦する 🔄</button>
    </div>
  </div>
</div>

<script>
const allQuestions = {
  strategy: [
    {
      text: "企業の情報システムに関する中長期計画を立案し、経営戦略と整合した形でITを活用するための全社的な計画を何というか？",
      options: ["BCP（事業継続計画）", "EA（エンタープライズアーキテクチャ）", "情報システム戦略（IT戦略）", "DFD（データフロー図）"],
      answer: 2,
      explanation: "情報システム戦略（IT戦略）は、経営戦略を実現するために情報システムをどのように活用・整備するかを定めた中長期計画です。EA（エンタープライズアーキテクチャ）は組織全体のITと業務の体系的な設計手法で、IT戦略の実現手段の一つです。"
    },
    {
      text: "バランススコアカード（BSC）の4つの視点として、正しい組み合わせはどれか？",
      options: ["財務・顧客・内部プロセス・学習と成長", "品質・コスト・納期・安全", "人材・技術・財務・市場", "計画・実行・評価・改善"],
      answer: 0,
      explanation: "バランススコアカード（BSC）は、財務・顧客・内部ビジネスプロセス・学習と成長の4視点から組織の戦略を管理するフレームワークです。財務指標だけでなく非財務指標も含めてバランスよく評価します。"
    },
    {
      text: "SWOT分析において「S」が示すものはどれか？",
      options: ["戦略（Strategy）", "強み（Strengths）", "安全（Safety）", "スキル（Skills）"],
      answer: 1,
      explanation: "SWOT分析のSはStrengths（強み）です。S（強み）・W（弱み）・O（機会）・T（脅威）の4要素で自社を分析する経営戦略フレームワークです。内部環境（強み・弱み）と外部環境（機会・脅威）を組み合わせて戦略を立案します。"
    },
    {
      text: "プロダクトポートフォリオマネジメント（PPM）において、市場成長率が高く、市場占有率も高い事業を何というか？",
      options: ["問題児", "花形（スター）", "金のなる木", "負け犬"],
      answer: 1,
      explanation: "PPMではボストンコンサルティンググループが提唱した4象限で事業を分類します。市場成長率高・市場占有率高が「花形（スター）」です。市場成長率低・市場占有率高が「金のなる木」、市場成長率高・低シェアが「問題児」、両方低が「負け犬」です。"
    },
    {
      text: "既存のビジネスプロセスを抜本的に見直し、業績を劇的に向上させることを目的とした手法を何というか？",
      options: ["BPR（ビジネスプロセスリエンジニアリング）", "BPO（ビジネスプロセスアウトソーシング）", "ERP（基幹業務システム）", "CRM（顧客関係管理）"],
      answer: 0,
      explanation: "BPR（Business Process Re-engineering）は、業務プロセスをゼロから根本的に再設計して劇的な業績向上を図る手法です。BPOは業務プロセスを外部委託すること、ERPは基幹業務を統合したシステム、CRMは顧客との関係を管理・強化するシステムです。"
    },
    {
      text: "顧客との長期的な関係を構築・維持し、顧客満足度を高めることで収益向上を図るシステムやマネジメント手法を何というか？",
      options: ["SCM（サプライチェーンマネジメント）", "ERP（エンタープライズリソースプランニング）", "CRM（カスタマーリレーションシップマネジメント）", "KMS（ナレッジマネジメントシステム）"],
      answer: 2,
      explanation: "CRM（Customer Relationship Management）は、顧客情報を一元管理し、顧客との関係を強化して顧客満足度・ロイヤリティを高めるシステム・手法です。SCMは原材料から顧客までの供給連鎖全体を最適化する手法、ERPは企業資源全体を統合管理するシステムです。"
    },
    {
      text: "他社には真似できない、その企業固有の強みや競争優位の源泉となる中核的な能力を何というか？",
      options: ["コアコンピタンス", "ベンチマーキング", "アウトソーシング", "バリューチェーン"],
      answer: 0,
      explanation: "コアコンピタンス（Core Competence）は、競合他社が容易に模倣できない自社固有の核となる能力・技術・ノウハウのことです。ベンチマーキングは優良企業の手法を比較・参考にする手法、バリューチェーンはポーターが提唱した企業の価値創造活動の分析手法です。"
    },
    {
      text: "投資に対して得られる利益の割合を表す指標で、投資の効率性を評価するために使われるものはどれか？",
      options: ["ROI（投資利益率）", "KPI（重要業績評価指標）", "NPV（正味現在価値）", "IRR（内部収益率）"],
      answer: 0,
      explanation: "ROI（Return On Investment）は「（利益 ÷ 投資額）× 100」で計算され、投資に対してどれだけ利益を得られたかを示す指標です。ITシステム投資の効果測定にも広く使われます。KPIは目標達成度を測る指標、NPVは将来のキャッシュフローを現在価値に換算した指標です。"
    },
    {
      text: "自然災害やシステム障害などの緊急事態が発生した際に、事業を継続・早期復旧させるための計画を何というか？",
      options: ["SLA（サービスレベル合意書）", "BCP（事業継続計画）", "DR（ディザスタリカバリ）", "RTO（目標復旧時間）"],
      answer: 1,
      explanation: "BCP（Business Continuity Plan：事業継続計画）は、緊急事態・災害時でも重要な事業を継続または早期に復旧するための計画です。DR（ディザスタリカバリ）はITシステムの復旧に焦点を当てた概念、RTOは目標復旧時間、SLAはサービス品質の合意書です。"
    },
    {
      text: "企業の経営資源（ヒト・モノ・カネ・情報）を統合的に管理し、経営の効率化を図るシステムはどれか？",
      options: ["CRM", "SCM", "ERP", "MRP"],
      answer: 2,
      explanation: "ERP（Enterprise Resource Planning：企業資源計画）は、財務・人事・製造・販売・在庫など企業の基幹業務を統合したシステムです。部門間でデータを共有し、リアルタイムな経営情報の把握・意思決定を支援します。MRPは資材所要量計画で製造業における部品・原材料の調達計画システムです。"
    }
  ],

  management: [
    {
      text: "プロジェクトマネジメントにおける WBS（Work Breakdown Structure）の説明として、正しいものはどれか？",
      options: [
        "作業の依存関係とスケジュールを表したネットワーク図",
        "プロジェクトの作業を階層的に分解した成果物指向の構造図",
        "各作業担当者と役割を示した責任分担表",
        "コストと進捗を管理するための予算管理表"
      ],
      answer: 1,
      explanation: "WBS（Work Breakdown Structure）は、プロジェクトの全作業を管理可能な小さな単位に階層的に分解した図です。成果物を中心に分解し、スコープの漏れを防ぎます。ネットワーク図はアローダイアグラムやPERTが該当します。"
    },
    {
      text: "システムの信頼性指標において、稼働率の計算式として正しいものはどれか？",
      options: [
        "稼働率 = MTTR ÷ (MTBF + MTTR)",
        "稼働率 = MTBF ÷ (MTBF + MTTR)",
        "稼働率 = MTBF × MTTR",
        "稼働率 = MTTR ÷ MTBF"
      ],
      answer: 1,
      explanation: "稼働率 = MTBF ÷ (MTBF + MTTR) です。MTBF（Mean Time Between Failures）は平均故障間隔、MTTR（Mean Time To Repair）は平均修復時間です。稼働率が高いほど信頼性の高いシステムです。"
    },
    {
      text: "プロジェクトのスケジュール管理で用いられる、作業の開始・終了を横棒で表したチャートを何というか？",
      options: ["アローダイアグラム", "ガントチャート", "フィッシュボーンダイアグラム", "ブレークダウンチャート"],
      answer: 1,
      explanation: "ガントチャートは、縦軸に作業項目、横軸に時間をとり、各作業の期間を横棒で表した図です。作業の進捗状況を視覚的に把握しやすく、プロジェクト管理で広く使用されます。アローダイアグラムは作業の依存関係を矢印で表したネットワーク図です。"
    },
    {
      text: "アローダイアグラム（PERT図）において、プロジェクト全体の完了を最も遅らせる最長経路を何というか？",
      options: ["クリティカルパス", "フロートパス", "ベースラインパス", "マイルストーン"],
      answer: 0,
      explanation: "クリティカルパスは、プロジェクト開始から完了までの経路の中で最も所要時間が長い経路です。クリティカルパス上の作業が遅延するとプロジェクト全体の完了が遅れるため、重点管理が必要です。フロートは作業の余裕時間です。"
    },
    {
      text: "ソフトウェア開発において、要件定義→設計→実装→テスト→運用の各工程を順に実施していく開発モデルはどれか？",
      options: ["スクラム", "ウォーターフォールモデル", "スパイラルモデル", "XP（エクストリームプログラミング）"],
      answer: 1,
      explanation: "ウォーターフォールモデルは、上流工程から下流工程へ川の流れのように順次進める開発モデルです。各工程を完結させてから次工程に進むため、計画・管理しやすい反面、後工程での仕様変更に弱いという特徴があります。"
    },
    {
      text: "テスト技法のうち、プログラムの内部構造を考慮せず、入力と出力の仕様のみからテストケースを設計する手法はどれか？",
      options: ["ホワイトボックステスト", "ブラックボックステスト", "パスカバレッジテスト", "ミューテーションテスト"],
      answer: 1,

const categoryConfig = {
  strategy:   { label: 'ストラテジ系',   badgeClass: 'badge-strategy' },
  management: { label: 'マネジメント系', badgeClass: 'badge-management' },
  technology: { label: 'テクノロジ系',   badgeClass: 'badge-technology' }
};

let currentCategory = null;
let shuffledQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(category) {
  currentCategory = category;
  currentIndex = 0;
  score = 0;
  shuffledQuestions = shuffle(allQuestions[category]).slice(0, 10);

  document.getElementById('topPage').classList.add('hide');
  document.getElementById('quizPage').classList.add('show');

  const cfg = categoryConfig[category];
  const badge = document.getElementById('categoryBadge');
  badge.textContent = cfg.label;
  badge.className = 'category-badge ' + cfg.badgeClass;

  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = shuffledQuestions[currentIndex];
  const total = shuffledQuestions.length;

  document.getElementById('progressFill').style.width = `${(currentIndex / total) * 100}%`;
  document.getElementById('questionCounter').textContent = `問題 ${currentIndex + 1} / ${total}`;
  document.getElementById('questionText').textContent = q.text;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  const labels = ['ア', 'イ', 'ウ', 'エ'];

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-label">${labels[i]}</span>${opt}`;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });

  document.getElementById('explanation').classList.remove('show');
  document.getElementById('btnNext').classList.remove('show');
}

function selectAnswer(selectedIndex) {
  if (answered) return;
  answered = true;

  const q = shuffledQuestions[currentIndex];
  const buttons = document.querySelectorAll('.option-btn');

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === selectedIndex) btn.classList.add('incorrect');
  });

  if (selectedIndex === q.answer) score++;

  const expEl = document.getElementById('explanation');
  expEl.innerHTML = `<strong>解説：</strong> ${q.explanation}`;
  expEl.classList.add('show');

  const btnNext = document.getElementById('btnNext');
  btnNext.textContent = currentIndex + 1 < shuffledQuestions.length ? '次の問題へ →' : '結果を見る 📊';
  btnNext.classList.add('show');
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < shuffledQuestions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quizPage').classList.remove('show');
  document.getElementById('resultPage').classList.add('show');

  const total = shuffledQuestions.length;
  const accuracy = Math.round((score / total) * 100);

  document.getElementById('scoreNumber').textContent = score;
  document.getElementById('correctCount').textContent = score;
  document.getElementById('incorrectCount').textContent = total - score;
  document.getElementById('accuracyRate').textContent = accuracy + '%';

  let title, message;
  if (accuracy >= 90) {
    title = '素晴らしい！合格レベルです🎉';
    message = 'ITパスポート試験の合格ラインは70%以上です。この調子で本番も頑張りましょう！';
  } else if (accuracy >= 70) {
    title = 'もう少しです！合格ラインに達しています✨';
    message = '合格ラインの70%を超えています。苦手分野を復習してさらに得点を伸ばしましょう。';
  } else {
    title = '要復習です📚';
    message = '合格ラインの70%には届きませんでした。解説をよく読んで再挑戦してみましょう。';
  }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMessage').textContent = message;

  document.getElementById('progressFill').style.width = '100%';
}

function restartQuiz() {
  document.getElementById('resultPage').classList.remove('show');
  startQuiz(currentCategory);
}

function goTop() {
  document.getElementById('resultPage').classList.remove('show');
  document.getElementById('quizPage').classList.remove('show');
  document.getElementById('topPage').classList.remove('hide');
}
</script>
